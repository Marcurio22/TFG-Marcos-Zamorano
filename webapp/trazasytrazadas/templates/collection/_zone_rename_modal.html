<!--
Parcial del modal de renombrado de zonas.

Contiene el formulario reutilizable para cambiar el nombre visible de
una zona guardada sin duplicar marcado entre vistas.

Autor: Marcos Zamorano Lasso
Versión: 1.0
-->
<dialog id="zone-rename-modal" class="modal">
    <div class="modal-box max-w-lg">
        <div class="flex items-start justify-between gap-3">
            <div>
                <h3 class="font-bold text-lg">{{ _("Renombrar colección") }}</h3>
                <p id="rename-zone-current-display" class="text-sm opacity-75"></p>
            </div>
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost"
                        aria-label="{{ _("Cerrar") }}"
                        title="{{ _("Cerrar") }}">✕</button>
            </form>
        </div>
        <form id="zone-rename-form" method="post" class="mt-4 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden"
                   name="redirect_to"
                   id="rename-zone-redirect-to"
                   value="{{ rename_redirect_to }}">
            <label class="form-control">
                <div class="label pb-1">
                    <span class="label-text">{{ _("Nombre de la colección") }}</span>
                </div>
                <input id="rename-zone-name-input"
                       name="name"
                       type="text"
                       maxlength="120"
                       class="input input-bordered w-full"
                       placeholder="{{ _("Escribe un nombre o deja vacío para usar el nombre por defecto") }}"
                       title="{{ _("Escribe un nombre personalizado para identificar mejor esta colección.") }}" />
            </label>
        </form>
        <div class="modal-action">
            <button type="submit"
                    form="zone-rename-form"
                    class="btn btn-primary"
                    title="{{ _("Guarda el nuevo nombre de la colección.") }}">{{ _("Guardar") }}</button>
            <form method="dialog">
                <button class="btn btn-ghost"
                        title="{{ _("Cancela los cambios y cierra la ventana.") }}">{{ _("Cancelar") }}</button>
            </form>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button aria-label="{{ _("Cerrar") }}" title="{{ _("Cerrar") }}"></button>
    </form>
</dialog>
