services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: trazasytrazadas-web:latest
    container_name: trazasytrazadas-web
    env_file:
      - .env
    init: true
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./instance:/app/instance
    environment:
      AUTO_START_TRACE_WORKER: "false"
      FLASK_INSTANCE_PATH: /app/instance
      TRAZAS_INSTANCE_PATH: /app/instance
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    restart: unless-stopped
    shm_size: "1gb"
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: trazasytrazadas-web:latest
    env_file:
      - .env
    init: true
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./instance:/app/instance
    environment:
      AUTO_START_TRACE_WORKER: "false"
      FLASK_INSTANCE_PATH: /app/instance
      TRAZAS_INSTANCE_PATH: /app/instance
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - flask
      - --app
      - run:app
      - traces-worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    restart: unless-stopped
    shm_size: "1gb"
    stop_grace_period: 60s
